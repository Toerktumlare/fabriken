env:
  BUILD_ID: "latest"

pipeline:

- name: clean
  image: docker.io/library/rust:slim
  run:
    - cargo clean

# - name: test
#   image: docker.io/library/rust:slim
#   run:
#     - cargo test
#   depends_on: [clean]

- name: build
  image: docker.io/library/rust:slim
  run:
    - cargo build --release

- name: build container
  env:
    IMAGE_NAME: fabriken
  containerize:
    builder: buildah
    file: ./Dockerfile
    context: .
    image: controller:latest

